[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-mixer-app"
version = "0.1.0"
description = "Laptop companion app for the Desk-Mixer device"
requires-python = ">=3.11"
# Provisional. These are what the design in README.md calls for; nothing is
# implemented yet, so trim or add as the app is actually built.
dependencies = [
    "PySide6>=6.6",       # UI
    "pyserial>=3.5",      # device link
    "requests>=2.31",     # Spotify Web API
    "mutagen>=1.47",      # reading tags from local audio files
    "platformdirs>=4.0",  # config and cache locations
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Entry point, once __main__.py exists.
[project.scripts]
desk-mixer = "desk_mixer_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["desk_mixer_app"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

# These are all imported lazily and guarded at the call site, so the app runs
# without them. Type checking must not require them to be installed.
[[tool.mypy.overrides]]
module = ["serial.*", "PySide6.*", "mutagen.*", "platformdirs.*", "requests.*"]
ignore_missing_imports = true
