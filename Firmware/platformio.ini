; PlatformIO Project Configuration File
;
; Desk-Mixer firmware — Teensy 4.1
;
;   teensy41       build and flash the real device
;   teensy41_test  on-target Unity tests (needs hardware attached)
;   native         host Unity tests over hardware-independent code
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

; -----------------------------------------------------------------------------
; Hardware-independent sources.
;
; Any module that includes no Arduino or Teensy headers can be compiled and
; unit-tested on the laptop. List those files here and the `native` environment
; picks them up. There is no Teensy 4.1 emulator, so this is the only way to get
; automated tests of firmware logic — see README.md.
;
; Add entries as modules are written, for example:
;   sources =
;       +<dsp/mix_math.cpp>
;       +<link/framing.cpp>
; -----------------------------------------------------------------------------
[pure]
sources =

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

; USB_MIDI_SERIAL gives a CDC serial port for the companion app protocol and a
; MIDI device so the mixer can double as a DJ-software control surface.
; USB type is compile-time and exclusive: MTP and USB Audio cannot join this.
; See Docs/decisions/0001-usb-port-roles.md.
build_flags =
	-D USB_MIDI_SERIAL

; Warnings are scoped to src/ with build_src_flags. Applying -Wall/-Wextra
; globally buries our own diagnostics under thousands of lines from the Teensy
; core and the audio libraries, which we do not control.
build_src_flags =
	-Wall
	-Wextra

; Libraries are added as subsystems need them, for example:
;   lib_deps =
;       https://github.com/newdigate/teensy-variable-playback.git
; The Audio, SD and SdFat libraries ship with Teensyduino and need no entry.
lib_deps =

[env:teensy41_test]
extends = env:teensy41
test_framework = unity
; PlatformIO claims the first Serial as its test transport, so anything that
; prints must be wrapped in #ifndef UNIT_TEST.
build_flags =
	${env:teensy41.build_flags}
	-D UNIT_TEST
build_src_flags = ${env:teensy41.build_src_flags}

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> ${pure.sources}
build_flags =
	-std=gnu++17
	-D UNIT_TEST
	-Wall
	-Wextra
	-I include
